<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WealthFlow | Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-6">

    <main class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-8 shadow-2xl">
        <div class="mb-8 text-center">
            <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-600 text-2xl font-bold">
                W
            </div>

            <h1 class="text-2xl font-bold">WealthFlow Admin</h1>
            <p class="mt-2 text-sm text-slate-400">
                Sign in to access the administration portal.
            </p>
        </div>

        {% if error %}
        <div role="alert" class="mb-5 rounded-lg border border-red-800 bg-red-950/50 p-3 text-sm text-red-300">
            {{ error }}
        </div>
        {% endif %}

        <form action="/admin/login" method="post" class="space-y-5">
            <div>
                <label for="password" class="mb-2 block text-sm font-medium">
                    Admin password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    required
                    autocomplete="current-password"
                    class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30"
                    placeholder="Enter your admin password"
                >
            </div>

            <button
                type="submit"
                class="w-full rounded-lg bg-indigo-600 px-4 py-3 font-semibold transition hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-400"
            >
                Sign in securely
            </button>
        </form>

        <p class="mt-6 text-center text-xs text-slate-500">
            Authorized administrators only.
        </p>
    </main>

</body>
</html>
